services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: nextpay
      POSTGRES_PASSWORD: nextpay_local
      POSTGRES_DB: nextpay
    volumes:
      - nextpay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nextpay -d nextpay']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nextpay_pg_data:
